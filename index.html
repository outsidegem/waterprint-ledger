<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaterPrint Ledger · AI Resource Awareness</title>
  <style>
    :root{--bg:#0d1117;--card:#161b22;--border:#30363d;--accent-blue:#58a6ff;--accent-cyan:#39d353;--text:#c9d1d9;--text-muted:#8b949e}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;padding:24px 16px;line-height:1.5}
    .container{max-width:760px;margin:0 auto}
    header{text-align:center;margin-bottom:28px}
    header h1{font-size:26px;color:#fff;margin-bottom:6px}
    .badge{display:inline-block;padding:3px 8px;background:#21262d;border:1px solid var(--border);border-radius:12px;font-size:12px;color:var(--accent-blue);margin-top:8px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:20px}
    label{display:block;font-weight:600;margin-bottom:8px;font-size:14px}
    textarea{width:100%;height:110px;background:#0d1117;border:1px solid var(--border);border-radius:6px;padding:12px;color:#fff;font-size:14px;resize:vertical}
    .btn{background:#238636;color:#fff;border:none;padding:10px 16px;border-radius:6px;font-weight:600;cursor:pointer;margin-top:10px}
    .btn-secondary{background:#21262d;border:1px solid var(--border);margin-left:8px}
    .metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
    .metric-box{background:#0d1117;border:1px solid var(--border);padding:12px;border-radius:6px;text-align:center}
    .metric-val{font-size:20px;font-weight:bold;color:var(--accent-blue)}
    .metric-val.green{color:var(--accent-cyan)}
    .metric-sub{font-size:12px;color:var(--text-muted)}
    .result-box{margin-top:16px;padding:12px;background:#0d1117;border-left:3px solid var(--accent-cyan);font-size:13px}
    .tx-receipt{margin-top:12px;padding:12px;background:#1c2128;border:1px solid var(--border);border-radius:6px;font-family:monospace;font-size:12px;word-break:break-all}
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>💧 WaterPrint Ledger</h1>
    <p>«Don't use less AI. Use AI better.»</p>
    <div class="badge">EVM Attestation Layer</div>
  </header>
  <div class="card">
    <label>Input AI Prompt to Evaluate</label>
    <textarea id="promptInput" placeholder="Enter a wordy prompt..."></textarea>
    <div>
      <button class="btn" id="optimizeBtn">⚡ Lint & Optimize</button>
      <button class="btn btn-secondary" id="attestBtn">📜 Prepare Attestation</button>
    </div>
    <div class="metrics-grid">
      <div class="metric-box"><div class="metric-val" id="baselineEnergy">0 mWh</div><div class="metric-sub">Baseline Energy</div></div>
      <div class="metric-box"><div class="metric-val" id="baselineWater">0 µL</div><div class="metric-sub">Baseline Water</div></div>
    </div>
  </div>
  <div class="card" id="optimizationCard" style="display: none;">
    <label>Optimization Analysis (estimated_avoided)</label>
    <div class="result-box" id="optimizationSummary"></div>
    <div class="metrics-grid">
      <div class="metric-box"><div class="metric-val green" id="avoidedEnergy">0 mWh</div><div class="metric-sub">Energy Avoided</div></div>
      <div class="metric-box"><div class="metric-val green" id="avoidedWater">0 µL</div><div class="metric-sub">Water Avoided</div></div>
    </div>
  </div>
  <div class="card" id="ledgerCard" style="display: none;">
    <label>Immutable Attestation Payload</label>
    <div class="tx-receipt" id="receiptOutput"></div>
  </div>
</div>
<script>
  const BASE_ENERGY_MWH = 340; 
  const BASE_WATER_UML = 320; 

  const promptInput = document.getElementById('promptInput');
  const optimizeBtn = document.getElementById('optimizeBtn');
  const attestBtn = document.getElementById('attestBtn');
  const baselineEnergyEl = document.getElementById('baselineEnergy');
  const baselineWaterEl = document.getElementById('baselineWater');
  const optimizationCard = document.getElementById('optimizationCard');
  const optimizationSummary = document.getElementById('optimizationSummary');
  const avoidedEnergyEl = document.getElementById('avoidedEnergy');
  const avoidedWaterEl = document.getElementById('avoidedWater');
  const ledgerCard = document.getElementById('ledgerCard');
  const receiptOutput = document.getElementById('receiptOutput');

  let currentAvoidedMWh = 0;
  let currentAvoidedUml = 0;

  promptInput.addEventListener('input', () => {
    const text = promptInput.value.trim();
    if (!text) return;
    const tokenEst = Math.max(1, Math.ceil(text.length / 4));
    const factor = 1 + (tokenEst / 100) * 0.15;
    baselineEnergyEl.innerText = Math.round(BASE_ENERGY_MWH * factor) + " mWh";
    baselineWaterEl.innerText = Math.round(BASE_WATER_UML * factor) + " µL";
  });

  function optimizeText(raw) {
    let clean = raw
      .replace(/\b(As an AI( language model)?|Certainly!?|I'?d be happy to help|Sure thing!?|Here is the( information)?)\b/gi, '')
      .replace(/\b(please\s+(can\s+you\s+)?(kindly\s+)?|can\s+you\s+(please\s+)?|i\s+want\s+you\s+to\s+know\s+that|you\s+see\s+what\s+i\s+mean\??)\b/gi, '')
      .replace(/\b(it is (important|crucial) to note that|as a matter of fact|at the end of the day|due to the fact that|needless to say|for the purpose of|in order to)\b/gi, '')
      .replace(/\b(very|really|basically|essentially|literally|totally|definitely|actually|just|simply)\b/gi, '')
      .replace(/([.?!])\1+/g, '$1')
      .replace(/\s{2,}/g, ' ')
      .trim();
    return clean.length > 5 ? clean : raw;
  }

  optimizeBtn.addEventListener('click', () => {
    const raw = promptInput.value.trim();
    if (!raw) return;

    const optimized = optimizeText(raw);
    const rawTokens = Math.max(1, Math.ceil(raw.length / 4));
    const optTokens = Math.max(1, Math.ceil(optimized.length / 4));
    
    const baseEnergy = Math.round(BASE_ENERGY_MWH * (1 + (rawTokens / 100) * 0.15));
    const optEnergy = Math.round(BASE_ENERGY_MWH * (1 + (optTokens / 100) * 0.15));
    const baseWater = Math.round(BASE_WATER_UML * (1 + (rawTokens / 100) * 0.15));
    const optWater = Math.round(BASE_WATER_UML * (1 + (optTokens / 100) * 0.15));

    currentAvoidedMWh = Math.max(0, baseEnergy - optEnergy);
    currentAvoidedUml = Math.max(0, baseWater - optWater);

    optimizationSummary.innerHTML = `<strong>Optimized Prompt:</strong> "${optimized}"<br><span style="color:#8b949e">Tokens reduced from ${rawTokens} to ${optTokens}.</span>`;
    avoidedEnergyEl.innerText = currentAvoidedMWh + " mWh";
    avoidedWaterEl.innerText = currentAvoidedUml + " µL";
    optimizationCard.style.display = 'block';
  });

  async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return '0x' + hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  attestBtn.addEventListener('click', async () => {
    if (!promptInput.value.trim()) return;
    const timestamp = Math.floor(Date.now() / 1000);
    const canonicalString = `node=0x1111|mwh=${currentAvoidedMWh}|uml=${currentAvoidedUml}|v=1|ts=${timestamp}`;
    const canonicalHash = await sha256(canonicalString);

    receiptOutput.innerHTML = `<strong>Canonical Hash:</strong> ${canonicalHash}<br><strong>Energy Avoided:</strong> ${currentAvoidedMWh} mWh<br><strong>Water Avoided:</strong> ${currentAvoidedUml} µL<br><strong>Accounting Type:</strong> estimated_avoided`;
    ledgerCard.style.display = 'block';
  });
</script>
</body>
</html>
